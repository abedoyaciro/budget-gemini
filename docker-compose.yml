# Docker es opcional. En Windows usa el runner nativo:
#   .\scripts\budget.ps1 help
#
# Uso de este compose:
#   docker compose run --rm wallet-tools python tools/backup_wallet.py
#   docker compose run --rm wallet-tools python tools/bootstrap_rules.py --days 0
#   docker compose run --rm wallet-tools python tools/conciliar_cuenta.py --plan plans/x.json --dry-run

services:
  wallet-tools:
    build: .
    image: wallet-tools:latest
    container_name: wallet-tools
    env_file:
      - .env
    environment:
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
      - PYTHONPATH=/app/tools
    volumes:
      - ./output:/app/output
      - ./rules:/app/rules
      - ./plans:/app/plans
    # El DNS de Docker fallo antes en esta red (Errno 11001): fijarlo evita
    # extracciones a medias.
    dns:
      - 8.8.8.8
    command: ["python", "tools/backup_wallet.py"]
    restart: "no"
